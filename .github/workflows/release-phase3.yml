name: Publish Phase 3 Windows prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Phase 3 source tag
        required: true
        default: v0.6.1-phase3
        type: string

permissions:
  contents: write

concurrency:
  group: phase3-prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.6.1-phase3' }}
    steps:
      - name: Check out the tagged application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || 'v0.6.1-phase3' }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test API handling, timing and configuration
        run: npm test
      - name: Require verified enabled timer presets
        shell: pwsh
        run: |
          $config = Get-Content config/timing-rules.json -Raw | ConvertFrom-Json
          if ($config.revision -lt 1) { throw 'Timing preset verification is unfinished.' }
          foreach ($rule in $config.rules) {
            if (!$rule.enabled -or !$rule.confirmed -or !$rule.source) {
              throw "The built-in rule $($rule.id) is not verified and enabled."
            }
          }
      - name: Verify native Windows tiny-screen capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @('-NoLogo', '-NoProfile', '-NonInteractive', '-Command', (Get-Content scripts/capture-clock.ps1 -Raw))) { $start.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"x":0,"y":0,"width":40,"height":20,"preview":true}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(20000)) { $process.Kill(); throw 'Native capture timed out.' }
          $frame = $output.GetAwaiter().GetResult() | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or !$frame.image -or $frame.observedAt -le 0) { throw "Native capture failed: $($errors.GetAwaiter().GetResult())" }
          $bytes = [Convert]::FromBase64String($frame.image)
          if ([BitConverter]::ToString($bytes[0..7]) -ne '89-50-4E-47-0D-0A-1A-0A') { throw 'Capture did not return PNG pixels.' }
          Write-Output 'Native Windows 40 x 20 crop verified; no image saved.'
      - name: Verify native Windows speech adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @('-NoLogo', '-NoProfile', '-NonInteractive', '-Command', (Get-Content scripts/alert-voice.ps1 -Raw))) { $start.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"id":1,"action":"voices"}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(20000)) { $process.Kill(); throw 'Speech adapter timed out.' }
          $result = $output.GetAwaiter().GetResult() | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or $result.id -ne 1 -or $result.error) { throw "Speech adapter failed: $($errors.GetAwaiter().GetResult()) $($result.error)" }
          Write-Output "Native speech adapter verified; $(@($result.voices).Count) installed voices on this runner."
      - name: Build the portable Windows application
        run: npm run dist:win:zip
      - name: Publish the prerelease with the ZIP and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-phase3$') {
            throw 'Expected a Phase 3 version tag such as v0.6.1-phase3.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $originalZip = "Deadlock Companion-$version-win.zip"
          $zipName = "Deadlock.Companion-$version-win.zip"
          Rename-Item (Join-Path release $originalZip) $zipName
          $zipPath = Join-Path release $zipName
          if (!(Test-Path $zipPath)) { throw 'The Windows ZIP was not built.' }
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          @'
          Windows x64 Cursed Apple update (0.6.1). Close the app, extract the entire ZIP and launch Deadlock Companion.exe. Existing settings, crop, reminders, notes and goals carry over.

          New bottle-green/brass interface with original occult New York artwork. Three main destinations (Stats, Team Planner, Live Match); Settings is in the header. Hero statistics and long-term charts share one expandable section.

          History is the first priority in Stats: career coverage, current Steam-fetch status, guided bot setup, hourly full-history rebuild, verified recovery of known match IDs and durable imports/exports. New indexed games are collected every ten minutes outside a running match. Missing old games require the provider's Steam-bot access and cannot be manufactured by the app. Membership may be required; full recovery is not guaranteed.

          Planner uses all collected experience, manual comfort pools, hero locks, exclusions, Comfort/Balanced/Explore styles and distinct personal alternatives. It checks broad team roles and displays recorded ranked pairs and lineups separately. Evidence is not verified pro-tournament data; fit is not a predicted win probability.

          Companion estimates now use Initiate through Eternus with divisions and progress. They remain app performance estimates, not official Valve ranks or hidden MMR. A reported-badge sanity check is shown when enough ranked evidence exists. Best heroes consider all collected scored games with available reference data. Coaching is a measured gap, one short hero-specific action and a relevant death timestamp where supplied.

          Seven sounds, installed Windows voice choice (typically David/Zira), Operator/Lookout preferences, short announcements and 0.75–2x speed control. Default boxes and golden statues share one alert. Existing deliberately different custom schedules are retained. A persistent local Windows speech worker avoids starting a process per cue.

          Resume live tracking directly from Live Match after manual pause. New-match confirmation handles two consistent near-zero readings, and manual override idles the capture scheduler. Brief hidden clocks still use configurable holdover; unseen pauses remain undetectable until the clock returns.

          Validated with 82 unit, 16 browser and two production Electron checks including live API contracts and minimized sparse-clock audio. Windows CI checks tiny-screen capture and the native speech adapter before packaging. Physical sound output, live HUD recognition and FPS still need testing on your PC. Independent project; not affiliated with Valve.
          '@ | Set-Content -Encoding utf8NoBOM release/notes.md
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isPrerelease)) { throw 'The existing release is not a prerelease.' }
            gh release upload $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --prerelease --verify-tag --title 'Deadlock Companion — The Cursed Apple' --notes-file release/notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
