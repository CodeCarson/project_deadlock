name: Publish Phase 3 Windows prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Phase 3 source tag
        required: true
        default: v0.3.3-phase3
        type: string

permissions:
  contents: write

concurrency:
  group: phase3-prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.3.3-phase3' }}
    steps:
      - name: Check out the tagged application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || 'v0.3.3-phase3' }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test API handling, timing and configuration
        run: npm test
      - name: Require verified enabled timer presets
        shell: pwsh
        run: |
          $config = Get-Content config/timing-rules.json -Raw | ConvertFrom-Json
          if ($config.revision -lt 1) { throw 'Timing preset verification is unfinished.' }
          foreach ($rule in $config.rules) {
            if (!$rule.enabled -or !$rule.confirmed -or !$rule.source) {
              throw "The built-in rule $($rule.id) is not verified and enabled."
            }
          }
      - name: Verify native Windows tiny-screen capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @('-NoLogo', '-NoProfile', '-NonInteractive', '-Command', (Get-Content scripts/capture-clock.ps1 -Raw))) { $start.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"x":0,"y":0,"width":40,"height":20,"preview":true}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(20000)) { $process.Kill(); throw 'Native capture timed out.' }
          $frame = $output.GetAwaiter().GetResult() | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or !$frame.image -or $frame.observedAt -le 0) { throw "Native capture failed: $($errors.GetAwaiter().GetResult())" }
          $bytes = [Convert]::FromBase64String($frame.image)
          if ([BitConverter]::ToString($bytes[0..7]) -ne '89-50-4E-47-0D-0A-1A-0A') { throw 'Capture did not return PNG pixels.' }
          Write-Output 'Native Windows 40 x 20 crop verified; no image saved.'
      - name: Build the portable Windows application
        run: npm run dist:win:zip
      - name: Publish the prerelease with the ZIP and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-phase3$') {
            throw 'Expected a Phase 3 version tag such as v0.3.3-phase3.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $originalZip = "Deadlock Companion-$version-win.zip"
          $zipName = "Deadlock.Companion-$version-win.zip"
          Rename-Item (Join-Path release $originalZip) $zipName
          $zipPath = Join-Path release $zipName
          if (!(Test-Path $zipPath)) { throw 'The Windows ZIP was not built.' }
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          @'
          Phase 3 Windows x64 prerelease. Extract the entire ZIP and launch Deadlock Companion.exe. Keep the extracted files together. Existing settings, player selection and personal reminders use the same profile directory.

          Adds dedicated hero analytics, daily win-rate and KDA charts, reported rank trends where available, searchable match history with 25-match pages and expandable details, and persisted hero/mode/time filters. Missing fields remain unavailable; final net worth per minute is not claimed as total earned souls per minute.

          Separates normal Refresh from the hourly full-history rebuild. Shows available match count, newest match date, fetch timestamp and whether the provider reported calling Steam. The provider can return incomplete indexed history; a full rebuild requires provider Steam-bot access and does not guarantee complete career totals.

          Replaces Overwolf with an EXPERIMENTAL standalone Windows cropped-clock reader. No Overwolf installation or developer approval required. In Settings, select the display, adjust the tiny clock rectangle, Test clock crop, Save clock area, then enable automatic tracking. Bring Deadlock to the foreground. Local bundled OCR reads about once per second; images stay in memory with no recording or uploads. Only the configured rectangle is captured. Version 0.3.3 adds enlargement, contrast normalisation and fallback preprocessing for small HUD text; the preview shows the processed image. A valid crop can now be saved and the reader enabled even if OCR fails, while reminders still wait for reliable readings. Missing, stale or unreadable samples pause reminders. Manual controls remain available. Practice/spectator clocks cannot be distinguished; match-end detection is inferred from the clock disappearing. See README.md for calibration and transition limitations. Live game recognition and FPS/frame-time impact remain unverified; zero performance impact is not promised.

          Keeps the editable enabled October 6 timing presets. Customised rules are preserved. Restore defaults resets built-ins while keeping personal reminders and audio preferences.

          Unit, browser and native Electron checks cover analytics, history, persistence, API handling and minimised reminder audio. Native OCR tests use generated clock images and a simulated OS crop source, not a running game. The Windows runner additionally tests the real tiny-screen-crop adapter, runs unit tests and builds this ZIP with local OCR resources. Use Test sound on your PC to check your audio output. Independent community project; not affiliated with Valve.
          '@ | Set-Content -Encoding utf8NoBOM release/notes.md
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isPrerelease)) { throw 'The existing release is not a prerelease.' }
            gh release upload $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --prerelease --verify-tag --title 'Deadlock Companion — Phase 3' --notes-file release/notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
