name: Publish Phase 3 Windows prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Phase 3 source tag
        required: true
        default: v0.4.1-phase3
        type: string

permissions:
  contents: write

concurrency:
  group: phase3-prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.4.1-phase3' }}
    steps:
      - name: Check out the tagged application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || 'v0.4.1-phase3' }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test API handling, timing and configuration
        run: npm test
      - name: Require verified enabled timer presets
        shell: pwsh
        run: |
          $config = Get-Content config/timing-rules.json -Raw | ConvertFrom-Json
          if ($config.revision -lt 1) { throw 'Timing preset verification is unfinished.' }
          foreach ($rule in $config.rules) {
            if (!$rule.enabled -or !$rule.confirmed -or !$rule.source) {
              throw "The built-in rule $($rule.id) is not verified and enabled."
            }
          }
      - name: Verify native Windows tiny-screen capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @('-NoLogo', '-NoProfile', '-NonInteractive', '-Command', (Get-Content scripts/capture-clock.ps1 -Raw))) { $start.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"x":0,"y":0,"width":40,"height":20,"preview":true}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(20000)) { $process.Kill(); throw 'Native capture timed out.' }
          $frame = $output.GetAwaiter().GetResult() | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or !$frame.image -or $frame.observedAt -le 0) { throw "Native capture failed: $($errors.GetAwaiter().GetResult())" }
          $bytes = [Convert]::FromBase64String($frame.image)
          if ([BitConverter]::ToString($bytes[0..7]) -ne '89-50-4E-47-0D-0A-1A-0A') { throw 'Capture did not return PNG pixels.' }
          Write-Output 'Native Windows 40 x 20 crop verified; no image saved.'
      - name: Build the portable Windows application
        run: npm run dist:win:zip
      - name: Publish the prerelease with the ZIP and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-phase3$') {
            throw 'Expected a Phase 3 version tag such as v0.4.1-phase3.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $originalZip = "Deadlock Companion-$version-win.zip"
          $zipName = "Deadlock.Companion-$version-win.zip"
          Rename-Item (Join-Path release $originalZip) $zipName
          $zipPath = Join-Path release $zipName
          if (!(Test-Path $zipPath)) { throw 'The Windows ZIP was not built.' }
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          @'
          Windows x64 stats and improvement update. Extract the entire ZIP and launch Deadlock Companion.exe. Keep the extracted files together. Existing settings, player selection, reminders and clock configuration use the same local profile.

          Search by Steam display name with debounced indexed suggestions, avatar/account-ID disambiguation and keyboard selection. Numeric IDs and profile links remain supported. Names are not automatically matched to the first result.

          Analysis balances survival, combat, farming and hero results. Compare equal scored-game windows within one mode, explore duration-weighted rolling rates and sample-aware hero win rates, and save one goal for your next ten new scored games. Review prompts describe observed changes without claiming their cause.

          Load detailed postgame metadata on demand: kill participation, complete-team wealth/damage shares, recorded death timing, sampled resource/combat charts, recorded income counters and item events. Missing or incomplete fields stay unavailable. Income counters may not represent all earned souls. Current item names do not reconstruct a historical final build. Save per-match notes in a persistent local journal.

          History refreshes retain older collected matches. A coverage panel separates provider records from retained records, accepts your own estimated career total, and exports/imports validated same-account JSON history archives. Goals and journal notes remain in local settings, separate from history exports. The API has no pagination for older matches. Its indexed history can be incomplete; full-history rebuilds require provider Steam-bot access and do not guarantee a complete career total. Consult deadlock-api.com for current access instructions.

          Preserves the experimental standalone Windows cropped-clock reader from 0.3.3 and the editable enabled October 6 timing presets. Live game OCR reliability and FPS impact remain unverified. Manual timer controls remain available.

          Unit, browser and native Electron checks cover search, analytics, detailed review, archive import, persistence, API handling and minimised audio. The live desktop check verifies public search/history/metadata/items/profile endpoints. The Windows runner also tests the native tiny-screen-crop adapter and builds the ZIP with bundled local OCR resources. Independent community project; not affiliated with Valve.
          '@ | Set-Content -Encoding utf8NoBOM release/notes.md
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isPrerelease)) { throw 'The existing release is not a prerelease.' }
            gh release upload $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --prerelease --verify-tag --title 'Deadlock Companion — Stats & improvement' --notes-file release/notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
