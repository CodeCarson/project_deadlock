name: Publish Phase 3 Windows prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Phase 3 source tag
        required: true
        default: v0.7.4-phase3
        type: string

permissions:
  contents: write

concurrency:
  group: phase3-prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.7.4-phase3' }}
    steps:
      - name: Check out the tagged application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || 'v0.7.4-phase3' }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test API handling, timing and configuration
        run: npm test
      - name: Require verified enabled timer presets
        shell: pwsh
        run: |
          $config = Get-Content config/timing-rules.json -Raw | ConvertFrom-Json
          if ($config.revision -lt 1) { throw 'Timing preset verification is unfinished.' }
          foreach ($rule in $config.rules) {
            if (!$rule.enabled -or !$rule.confirmed -or !$rule.source) {
              throw "The built-in rule $($rule.id) is not verified and enabled."
            }
          }
      - name: Verify native Windows tiny-screen capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @('-NoLogo', '-NoProfile', '-NonInteractive', '-Command', (Get-Content scripts/capture-clock.ps1 -Raw))) { $start.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"x":0,"y":0,"width":40,"height":20,"preview":true}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(20000)) { $process.Kill(); throw 'Native capture timed out.' }
          $frame = $output.GetAwaiter().GetResult() | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or !$frame.image -or $frame.observedAt -le 0) { throw "Native capture failed: $($errors.GetAwaiter().GetResult())" }
          $bytes = [Convert]::FromBase64String($frame.image)
          if ([BitConverter]::ToString($bytes[0..7]) -ne '89-50-4E-47-0D-0A-1A-0A') { throw 'Capture did not return PNG pixels.' }
          Write-Output 'Native Windows 40 x 20 crop verified; no image saved.'
      - name: Verify native Windows speech adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @('-NoLogo', '-NoProfile', '-NonInteractive', '-Command', (Get-Content scripts/alert-voice.ps1 -Raw))) { $start.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"id":1,"action":"voices"}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(20000)) { $process.Kill(); throw 'Speech adapter timed out.' }
          $result = $output.GetAwaiter().GetResult() | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or $result.id -ne 1 -or $result.error) { throw "Speech adapter failed: $($errors.GetAwaiter().GetResult()) $($result.error)" }
          Write-Output "Native speech adapter verified; $(@($result.voices).Count) installed voices on this runner."
      - name: Build the portable Windows application
        run: npm run dist:win:zip
      - name: Verify production bundled voices on Windows
        env:
          COMPANION_TEST_EXECUTABLE: release/win-unpacked/Deadlock Companion.exe
        run: npx playwright test -c playwright.desktop.config.ts tests/desktop/voices.spec.ts
      - name: Publish the prerelease with the ZIP and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-phase3$') {
            throw 'Expected a Phase 3 version tag such as v0.7.4-phase3.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $originalZip = "Deadlock Companion-$version-win.zip"
          $zipName = "Deadlock.Companion-$version-win.zip"
          Rename-Item (Join-Path release $originalZip) $zipName
          $zipPath = Join-Path release $zipName
          if (!(Test-Path $zipPath)) { throw 'The Windows ZIP was not built.' }
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          @'
          Windows x64 timer and Team Planner update (0.7.4). Close the old app, extract the entire ZIP into a new folder and launch Deadlock Companion.exe. Timer rules, Silas/June voice choices, clock crop and planner settings carry over.

          Stats now displays only Coming soon. The previous dashboard, coaching, personal-rank calculator, graphs, journal/goals, archive controls, Stats settings and background Stats polling are removed. Dedicated source modules, compiled leftovers, charting dependencies and rank artwork are excluded from the package.

          Live Match retains editable objective reminders, combined boxes/statues alerts, personal reminders, Silas and June, adjustable alert speed, local clock capture, sparse clock synchronization and Resume live tracking. Team Planner retains Steam-name lookup, comfort pools, hero locks/exclusions, saved choices and alternative recommendations. Shared player-history and hero-fit data is retained for planner calculations only. The experimental secondary history source is still subject to provider access and incomplete coverage.

          Validated with unit/browser tests and three production Electron checks. Windows CI verifies native capture/speech, the Coming soon page and both bundled voices in the packaged Windows application before publication. No neural voice model runs during games. Deadlock artwork belongs to Valve; the app is an unofficial companion.
          '@ | Set-Content -Encoding utf8NoBOM release/notes.md
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isPrerelease)) { throw 'The existing release is not a prerelease.' }
            gh release upload $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --prerelease --verify-tag --title 'Deadlock Companion — Timer & Team Planner' --notes-file release/notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
