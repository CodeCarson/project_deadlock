name: Publish Phase 3 Windows prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Phase 3 source tag
        required: true
        default: v0.5.0-phase3
        type: string

permissions:
  contents: write

concurrency:
  group: phase3-prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.5.0-phase3' }}
    steps:
      - name: Check out the tagged application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || 'v0.5.0-phase3' }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test API handling, timing and configuration
        run: npm test
      - name: Require verified enabled timer presets
        shell: pwsh
        run: |
          $config = Get-Content config/timing-rules.json -Raw | ConvertFrom-Json
          if ($config.revision -lt 1) { throw 'Timing preset verification is unfinished.' }
          foreach ($rule in $config.rules) {
            if (!$rule.enabled -or !$rule.confirmed -or !$rule.source) {
              throw "The built-in rule $($rule.id) is not verified and enabled."
            }
          }
      - name: Verify native Windows tiny-screen capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @('-NoLogo', '-NoProfile', '-NonInteractive', '-Command', (Get-Content scripts/capture-clock.ps1 -Raw))) { $start.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"x":0,"y":0,"width":40,"height":20,"preview":true}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(20000)) { $process.Kill(); throw 'Native capture timed out.' }
          $frame = $output.GetAwaiter().GetResult() | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or !$frame.image -or $frame.observedAt -le 0) { throw "Native capture failed: $($errors.GetAwaiter().GetResult())" }
          $bytes = [Convert]::FromBase64String($frame.image)
          if ([BitConverter]::ToString($bytes[0..7]) -ne '89-50-4E-47-0D-0A-1A-0A') { throw 'Capture did not return PNG pixels.' }
          Write-Output 'Native Windows 40 x 20 crop verified; no image saved.'
      - name: Build the portable Windows application
        run: npm run dist:win:zip
      - name: Publish the prerelease with the ZIP and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-phase3$') {
            throw 'Expected a Phase 3 version tag such as v0.5.0-phase3.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $originalZip = "Deadlock Companion-$version-win.zip"
          $zipName = "Deadlock.Companion-$version-win.zip"
          Rename-Item (Join-Path release $originalZip) $zipName
          $zipPath = Join-Path release $zipName
          if (!(Test-Path $zipPath)) { throw 'The Windows ZIP was not built.' }
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          @'
          Windows x64 personal-homebase and smart-clock update. Close the app, extract the entire ZIP and launch Deadlock Companion.exe. Existing settings, reminders, notes, goals and clock crop are preserved.

          Four main tabs: Stats, Team Planner, Live Match and Settings. Match history, hero tables and long-term charts are expandable sections in Stats.

          The first readable clock seeds an independent local timer. After three initial checks, sparse two-reading bursts correct drift; default gap is 15 seconds. Two identical readings separated by at least 1.5 seconds pause it. Brief menus and alt-tabs keep the timer running, with a default 90-second limit since the last valid reading. Sync/grace intervals are editable. A pause while hidden cannot be detected until the clock returns; sparse checks can delay pause detection. Stop/Pause manually when leaving a match. FPS impact remains dependent on the PC.

          Per-game coaching compares the played hero and game duration with personal/community data, identifies a measured weakness or relative opportunity and offers one next-game focus with role context. Add the focus to a saved journal note.

          Companion performance ranks and best-three heroes use same-hero/mode/duration public quantiles, transparent weights and sample shrinkage. At least ten measured games are required for a custom rank, and five per hero for a recommendation. Ranked and unranked players can use it; private/bot/unknown modes are excluded. The custom bands estimate recorded performance and do not reveal hidden Valve MMR.

          Team Planner resolves Steam-name suggestions, accepts unique player accounts and optional hero locks, and matches personal experience to recorded ranked lineups or pair-based alternatives. All-ranked and Ascendant/Eternus evidence cohorts use the last 30 days. Full-lineup samples and intervals are displayed separately from planner fit. The API has no verified pro-match source; co-occurrence is not causal synergy and fit is not a predicted team win probability.

          Keeps durable collected-history archives and provider coverage instructions. The API may still omit career games; Steam-bot access controls full rebuilds. No Steam credentials are entered in the app.

          Validated with 71 unit, 14 browser and two production Electron tests, including live reference API calls, saved data, unique-hero assignment and minimised local-clock audio without continuous images. The Windows runner also checks native tiny-screen capture and packages bundled local OCR resources. Independent community project; not affiliated with Valve.
          '@ | Set-Content -Encoding utf8NoBOM release/notes.md
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isPrerelease)) { throw 'The existing release is not a prerelease.' }
            gh release upload $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $zipPath release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --prerelease --verify-tag --title 'Deadlock Companion — Personal homebase & smart clock' --notes-file release/notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
